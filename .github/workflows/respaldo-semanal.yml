# Respaldo con segundo custodio (ADR 0001 regla 6): pg_dump semanal completo,
# guardado como artefacto de GitHub (retención 90 días) — independiente de Supabase.
# Requiere el secreto DATABASE_URL. La restauración se prueba trimestralmente.
name: respaldo-semanal
on:
  schedule:
    - cron: "0 9 * * 0" # domingos 04:00 Bogotá
  workflow_dispatch: {}

jobs:
  respaldo:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Verificar configuración
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Sin DATABASE_URL en secretos: respaldo inactivo."; exit 0
          fi
          echo "activo=si" >> "$GITHUB_ENV"
      - name: pg_dump completo
        if: env.activo == 'si'
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges \
            --exclude-schema=staging --exclude-schema=graphql* \
            --exclude-schema=realtime --exclude-schema=storage \
            --exclude-schema=auth --exclude-schema=vault --exclude-schema=extensions \
            | gzip > cota-$(date +%Y%m%d).sql.gz
          ls -la cota-*.sql.gz
      - name: Guardar artefacto
        if: env.activo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-cota-${{ github.run_id }}
          path: cota-*.sql.gz
          retention-days: 90
